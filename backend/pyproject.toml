[project]
name = "dijitalvatan"
version = "0.1.0"
description = "Dijital Vatan search engine: crawler, inverted index, PageRank and search API"
readme = "README.md"
authors = [
    { name = "daktollo", email = "mevlutcanadiyanan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "selectolax>=1.0.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
